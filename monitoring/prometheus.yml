# vLLM exposes Prometheus metrics at /metrics (request counts, queue depth,
# KV-cache usage, time-to-first-token histograms...). Exact metric names vary by version.
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:8000"]
