apiVersion: v1
kind: Service
metadata:
  name: vllm-qwen
spec:
  selector: {app: vllm-qwen}
  ports:
    - {name: http, port: 80, targetPort: 8000}
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hf-cache            # caches downloaded model weights across pod restarts
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 20Gi}
